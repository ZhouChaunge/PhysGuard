exp_name: deeponet_cylinder
gpu: [0, 1, 2, 3]
ddp_port: 12357
seed: 0
results_path: ./results/001-cylinder/

# data
dataset_name: cylinder
dataset_root: ./data/realpdebench/
use_hf_dataset: true
num_workers: 32
normalizer: gaussian   # none, gaussian, range

# data parameters for training
mask_prob: 0.1
noise_scale: 0.1 # only applicable for numerical data

# model
model_name: deeponet
checkpoint_path:
p: 128
dropout_rate: 0.1

# training
is_use_tb: true
scheduler: cosine # step, cosine
step_size: 1000 # only applicable for step scheduler
num_update: 5000
train_batch_size: 4
test_batch_size: 8
lr: 0.0001
clip_grad_norm: 0.

# evaluation
N_autoregressive: 10
N_plot: 1
probe_diagnostic: True
N_plot_probe: 12

