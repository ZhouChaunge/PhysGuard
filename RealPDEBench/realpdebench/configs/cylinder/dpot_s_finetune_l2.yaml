exp_name: "dpot_s_cylinder"
gpu: 2
seed: 0
results_path: "./results/001-cylinder/"

# data
dataset_name: "cylinder"
dataset_root: "./data/realpdebench/"
use_hf_dataset: true
num_workers: 16
normalizer: "gaussian"

# data parameters for training
train_data_type: "real"
mask_prob: 0.1
noise_scale: 0.0  # extra noise injected to amplify sim-to-real distribution shift (physical-forgetting experiment)

# model
model_name: "dpot"
checkpoint_path: ./results/001-cylinder/dpot/dpot_s_cylinder_pretrained/2026-03-12_01-49-29/model_1360.pth
model_type: "dpot"
img_size: 128
patch_size: 8
in_channels: 4
out_channels: 4
embed_dim: 1024
depth: 6
n_blocks: 8
modes: 32
mlp_ratio: 1
out_layer_dim: 32
normalize: False
act: "gelu"
time_agg: "exp_mlp"
n_cls: 12
in_timesteps: 20
out_timesteps: 20

# training
is_use_tb:
scheduler: cosine
step_size: 1000
num_update: 4000
train_batch_size: 8  # doubled to match dpot_s_nullspace DP-4GPU effective batch=8
test_batch_size: 4
lr: 0.0001
clip_grad_norm: 0.5
use_amp: false

# L2 weight regularization
reg_type: "l2"
reg_lambda: 0.0001

# evaluation
N_autoregressive: 1
N_plot: 0
probe_diagnostic: True
N_plot_probe: 12
