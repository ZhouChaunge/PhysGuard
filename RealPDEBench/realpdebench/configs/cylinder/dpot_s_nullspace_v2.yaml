exp_name: "dpot_s_cylinder"
gpu: 3
seed: 0
results_path: "./results/001-cylinder/"

# data
dataset_name: "cylinder"
dataset_root: "./data/realpdebench/"
use_hf_dataset: true
num_workers: 32
normalizer: "gaussian"

# data parameters for training
train_data_type: "real"
mask_prob: 0.1
noise_scale: 0.0

# model
model_name: "dpot"
checkpoint_path: ./results/001-cylinder/dpot/dpot_s_cylinder_pretrained/2026-03-12_01-49-29/model_1360.pth
model_type: "dpot"
img_size: 128
patch_size: 8
in_channels: 4
out_channels: 4
embed_dim: 1024
depth: 6
n_blocks: 8
modes: 32
mlp_ratio: 1
out_layer_dim: 32
normalize: False
act: "gelu"
time_agg: "exp_mlp"
n_cls: 12
in_timesteps: 20
out_timesteps: 20

# training
is_use_tb:
scheduler: cosine
step_size: 1000
num_update: 4000
train_batch_size: 4
test_batch_size: 4
lr: 0.00005          # 5e-5: 10x higher than original 5e-6
clip_grad_norm: 0.5
use_amp: false

# evaluation
N_autoregressive: 1
N_plot: 0
probe_diagnostic: True
N_plot_probe: 12

# null-space fine-tuning specific
ns_n_components: 200    # increased from 50 to match larger model capacity
ns_variance_threshold: 0.9
ns_alpha: 1.0
ns_progressive: false
ns_beta_min: 0.3
ns_layer_wise: true
ns_max_samples: 200
ns_projection_path:
