exp_name: "deeponet_combustion"
gpu: 2  # single GPU: effective batch=4, matching deeponet_finetune_l2 and deeponet_nullspace (was [1,2,3] DDP=effective 12)
seed: 0
results_path: "./results/003-combustion/"

# data
dataset_name: "combustion"
dataset_root: "./data/realpdebench/"
use_hf_dataset: true
num_workers: 4
normalizer: "gaussian"

# data parameters for training
train_data_type: "real"
mask_prob: 0.1
noise_scale: 0.1  # extra noise injected to amplify sim-to-real distribution shift (physical-forgetting experiment)

# model
model_name: "deeponet"
checkpoint_path: ./results/003-combustion/deeponet/deeponet_combustion_pretrained/2026-03-21_10-20-54/model_0960.pth
p: 128
dropout_rate: 0.1

# training
is_use_tb:
scheduler: cosine
step_size: 1000
num_update: 4000
train_batch_size: 4
test_batch_size: 8
lr: 0.0001
clip_grad_norm: 0.

# EWC regularization
reg_type: "ewc"
reg_lambda: 1.0
ewc_num_samples: 200

# evaluation
N_autoregressive: 1
N_plot: 0
probe_diagnostic: True
N_plot_probe: 12
