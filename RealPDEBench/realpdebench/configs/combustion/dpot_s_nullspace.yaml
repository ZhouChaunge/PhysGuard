exp_name: "dpot_s_combustion"
gpu: [2, 3]
seed: 0
results_path: "./results/003-combustion/"

# data
dataset_name: "combustion"
dataset_root: "./data/realpdebench/"
use_hf_dataset: true
num_workers: 4
normalizer: "gaussian"

# data parameters for training
train_data_type: "real"
mask_prob: 0.1
noise_scale: 0.0

# model
model_name: "dpot"
checkpoint_path: ./results/003-combustion/dpot/dpot_s_combustion_pretrained/2026-03-21_17-01-45/model_3800.pth
model_type: "dpot"
img_size: 128
patch_size: 8
in_channels: 16
out_channels: 16
embed_dim: 1024
depth: 6
n_blocks: 8
modes: 32
mlp_ratio: 1
out_layer_dim: 32
normalize: False
act: "gelu"
time_agg: "exp_mlp"
n_cls: 12
in_timesteps: 20
out_timesteps: 20

# training
is_use_tb:
scheduler: cosine
step_size: 1000
num_update: 4000
train_batch_size: 4
test_batch_size: 4
lr: 0.000005
clip_grad_norm: 0.5
use_amp: false

# evaluation
N_autoregressive: 1
N_plot: 0

# null-space fine-tuning specific
ns_n_components: 100
ns_variance_threshold: 0.8
ns_alpha: 0.5
ns_progressive: true
ns_beta_min: 0.1
ns_layer_wise: true
ns_max_samples: 5886  # 10% of numerical train samples (58860)
ns_projection_path:
