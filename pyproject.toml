[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physguard"
version = "0.1.0"
description = "PhysGuard: Fisher-guided gradient projection for sim-to-real neural PDE surrogates."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Anonymous" },
]
keywords = [
  "scientific-ml",
  "physics",
  "pde",
  "sim-to-real",
  "fluid-dynamics",
  "combustion",
  "spatiotemporal",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "License :: Free for non-commercial use",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "tqdm",
  "torch",
  "torchvision",
  "torchinfo",
  "h5py",
  "pyyaml",
  "tensorboard",
  "einops",
  "einops-exts",
  "rotary-embedding-torch",
  "PyWavelets",
  "pytorch-wavelets",
  "ptwt",
  "pandas",
  "timm",
  "seaborn",
  "psutil",
  "requests",
  "huggingface-hub",
  "datasets",
]

[project.scripts]
realpdebench = "realpdebench.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["physguard", "physguard.*", "realpdebench", "realpdebench.*"]


