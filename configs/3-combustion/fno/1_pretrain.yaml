exp_name: "fno_combustion"
gpu: 0
seed: 0
results_path: "./results/003-combustion/"

# data
dataset_name: "combustion"
dataset_root: "./dataset/"
use_hf_dataset: true
num_workers: 12
normalizer: "gaussian" # none, gaussian, range

# data parameters for training
mask_prob: 0.5
noise_scale: 0.0 # only applicable for numerical data

# model
model_name: "fno" 
modes1: 4
modes2: 16
modes3: 16
n_layers: 4
width: 64

# training
is_use_tb: True
scheduler: cosine # step, cosine
step_size: 1000 # only applicable for step scheduler
num_update: 2000
train_batch_size: 16
test_batch_size: 16
lr: 0.01
clip_grad_norm: 0.

# evaluation
N_autoregressive: 1
N_plot: 0