exp_name: "fno_combustion"
gpu: 0
seed: 0
results_path: "./results/003-combustion/"

# data
dataset_name: "combustion"
dataset_root: "./dataset/"
use_hf_dataset: true
num_workers: 4
normalizer: "gaussian"

# data parameters for training
train_data_type: "real"
mask_prob: 0.1
noise_scale: 0.0

# model
model_name: "fno"
checkpoint_path: ./results/003-combustion/fno/fno_combustion_pretrained/2026-05-02_23-39-24/model_2000.pth
modes1: 4
modes2: 16
modes3: 16
n_layers: 4
width: 64

# training
is_use_tb:
scheduler: cosine
step_size: 1000
num_update: 4000
train_batch_size: 4
test_batch_size: 8
lr: 0.0001
clip_grad_norm: 0.

# evaluation
N_autoregressive: 1
N_plot: 0
probe_diagnostic: True
N_plot_probe: 12

# null-space fine-tuning specific
ns_n_components: 200
ns_variance_threshold: 0.9
ns_alpha: 1.0
ns_progressive: false
ns_beta_min: 0.3
ns_layer_wise: true
ns_max_samples: 200
ns_projection_path:
