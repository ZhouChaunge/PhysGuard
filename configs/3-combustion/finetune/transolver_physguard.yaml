exp_name: "transolver_combustion"
gpu: 0
seed: 0
results_path: "./results/003-combustion/"

# data
dataset_name: "combustion"
dataset_root: "./data/realpdebench/"
use_hf_dataset: true
num_workers: 16
normalizer: "gaussian"

# data parameters for training
train_data_type: "real"
mask_prob: 0.1
noise_scale: 0.0

# model
model_name: "transolver"
checkpoint_path: ./results/003-combustion/transolver/transolver_combustion_pretrained/2026-03-26_19-32-07/model_5000.pth
space_dim: 16
n_layers: 1
n_hidden: 256
n_head: 8
H: 64
W: 64
D: 20
fun_dim: 0
out_dim: 16
ref: 4
dropout: 0.1
act: "gelu"
mlp_ratio: 4
slice_num: 16

# training
is_use_tb:
scheduler: cosine
step_size: 1000
num_update: 4000
train_batch_size: 4
test_batch_size: 8
lr: 0.0001
clip_grad_norm: 0.

# evaluation
N_autoregressive: 1
N_plot: 0
probe_diagnostic: True
N_plot_probe: 12

# null-space fine-tuning specific
ns_n_components: 200          # upper-bound cap on k (per layer); adaptive k may be smaller
ns_variance_threshold: 0.9    # adaptive k: keep eigenvectors explaining >= 90% Fisher variance
                               # set to 0 to disable and always use fixed ns_n_components
ns_alpha: 1.0                 # protection strength: 1.0 = full null-space projection
ns_progressive: false          # enable progressive relaxation
ns_beta_min: 0.3              # min protection when progressive=true
ns_layer_wise: true            # per-layer vs global null-space
ns_max_samples: 5886           # 10% of numerical train samples (58860)
ns_projection_path:            # path to load/save pre-computed projections (optional)
