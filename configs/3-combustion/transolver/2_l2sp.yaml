exp_name: "transolver_combustion"
gpu: 0
seed: 0
results_path: "./results/003-combustion/"

# data
dataset_name: "combustion"
dataset_root: "./dataset/"
use_hf_dataset: true
num_workers: 16
normalizer: "gaussian"

# data parameters for training
train_data_type: "real"
mask_prob: 0.1
noise_scale: 0.1  # extra noise injected to amplify sim-to-real distribution shift (physical-forgetting experiment)

# model
model_name: "transolver"
checkpoint_path: ./results/.../model_XXXX.pth  # TODO: fill in your Step-1 pretrained checkpoint path
space_dim: 16
n_layers: 1
n_hidden: 256
n_head: 8
H: 64
W: 64
D: 20
fun_dim: 0
out_dim: 16
ref: 4
dropout: 0.1
act: "gelu"
mlp_ratio: 4
slice_num: 16

# training
is_use_tb:
scheduler: cosine
step_size: 1000
num_update: 4000
train_batch_size: 4
test_batch_size: 8
lr: 0.0001
clip_grad_norm: 0.

# L2 regularization (anti-forgetting baseline)
reg_type: "l2"
reg_lambda: 1.0e-4

# evaluation
N_autoregressive: 1
N_plot: 0
probe_diagnostic: True
N_plot_probe: 12
