exp_name: "deeponet_control"
gpu: 2
seed: 0
results_path: "./results/002-control_cylinder/"

# data
dataset_name: "controlled_cylinder"
dataset_root: "./data/realpdebench/"
use_hf_dataset: true
num_workers: 16
normalizer: "gaussian"

# data parameters for training
train_data_type: "real"
mask_prob: 0.1
noise_scale: 0.0  # extra noise injected to amplify sim-to-real distribution shift (physical-forgetting experiment)

# model
model_name: "deeponet"
checkpoint_path: ./results/002-control_cylinder/deeponet/deeponet_control_pretrained/2026-03-16_11-38-33/model_1000.pth
p: 256
dropout_rate: 0.1

# training  (same hyperparams as deeponet_nullspace.yaml for fair comparison)
is_use_tb:
scheduler: cosine
step_size: 1000
num_update: 4000
train_batch_size: 4
test_batch_size: 8
lr: 0.0001
clip_grad_norm: 0.
reg_type: none
reg_lambda: 0.0

# evaluation
N_autoregressive: 1
N_plot: 0
probe_diagnostic: True
N_plot_probe: 12
