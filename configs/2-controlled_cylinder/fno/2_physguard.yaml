exp_name: "fno_control"
gpu: 0
seed: 0
results_path: "./results/002-control_cylinder/"

# data
dataset_name: "controlled_cylinder"
dataset_root: "./dataset/"
use_hf_dataset: true
num_workers: 16
normalizer: "gaussian"

# data parameters for training
train_data_type: "real"
mask_prob: 0.1
noise_scale: 0.0

# model
model_name: "fno"
checkpoint_path: ./results/.../model_XXXX.pth  # TODO: fill in your Step-1 pretrained checkpoint path
modes1: 4
modes2: 12
modes3: 16
n_layers: 4
width: 64

# training
is_use_tb:
scheduler: cosine
step_size: 1000
num_update: 4000
train_batch_size: 4
test_batch_size: 8
lr: 0.0001
clip_grad_norm: 0.

# evaluation
N_autoregressive: 1
N_plot: 0
probe_diagnostic: True
N_plot_probe: 12

# null-space fine-tuning specific
ns_n_components: 500
ns_variance_threshold: 0.9
ns_alpha: 0.8
ns_progressive: false
ns_beta_min: 0.3
ns_layer_wise: true
ns_max_samples: 1892
ns_projection_path:
