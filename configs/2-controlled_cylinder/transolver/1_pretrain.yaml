exp_name: "transolver_control"
gpu: 0
seed: 0
results_path: "./results/002-control_cylinder/"

# data
dataset_name: "controlled_cylinder"
dataset_root: "./dataset/"
use_hf_dataset: true
num_workers: 16
normalizer: "gaussian"

# data parameters for training
mask_prob: 0.1
noise_scale: 0.1  # only applicable for numerical data

# model
model_name: "transolver"
space_dim: 5
n_layers: 1
n_hidden: 256
n_head: 8
H: 64
W: 128
D: 10
fun_dim: 0
out_dim: 3
ref: 4
dropout: 0.1
act: "gelu"
mlp_ratio: 4
slice_num: 16

# training
is_use_tb:
scheduler: cosine
step_size: 1000
num_update: 5000
train_batch_size: 4   # single GPU RTX4090; original used bs=32 multi-GPU, lr scaled
test_batch_size: 8
lr: 0.000125  # 0.001 * (4/32)
clip_grad_norm: 0.

# evaluation
N_autoregressive: 2
N_plot: 0
probe_diagnostic: True
N_plot_probe: 12
