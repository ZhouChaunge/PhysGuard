exp_name: deeponet_control
gpu: 0
ddp_port: 12358
seed: 0
results_path: ./results/002-control_cylinder/

# data
dataset_name: controlled_cylinder
dataset_root: ./dataset/
use_hf_dataset: true
num_workers: 4
normalizer: gaussian   # none, gaussian, range

# data parameters for training
mask_prob: 0.1
noise_scale: 0.1 # only applicable for numerical data

# model
model_name: deeponet
checkpoint_path:
p: 256
dropout_rate: 0.1

# training
is_use_tb: true
scheduler: cosine # step, cosine
step_size: 1000 # only applicable for step scheduler
num_update: 5000
train_batch_size: 16
test_batch_size: 32
lr: 0.00005
clip_grad_norm: 0.

# evaluation
N_autoregressive: 1
N_plot: 1
