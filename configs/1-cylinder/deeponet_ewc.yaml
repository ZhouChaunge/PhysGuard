exp_name: "deeponet_cylinder"
gpu: 1
seed: 0
results_path: "./results/001-cylinder/"

# data
dataset_name: "cylinder"
dataset_root: "./data/realpdebench/"
use_hf_dataset: true
num_workers: 32
normalizer: "gaussian"

# data parameters for training
train_data_type: "real"
mask_prob: 0.1
noise_scale: 0.0  # extra noise injected to amplify sim-to-real distribution shift (physical-forgetting experiment)

# model
model_name: "deeponet"
checkpoint_path: ./results/001-cylinder/deeponet/deeponet_cylinder_pretrained/2026-03-12_11-16-03/model_0100.pth
p: 128
dropout_rate: 0.1

# training
is_use_tb:
scheduler: cosine
step_size: 1000
num_update: 4000
train_batch_size: 4
test_batch_size: 8
lr: 0.0001
clip_grad_norm: 0.

# regularization
reg_type: "ewc"
reg_lambda: 1.0
ewc_num_samples: 200

# evaluation
N_autoregressive: 10
N_plot: 0
probe_diagnostic: True
N_plot_probe: 12
