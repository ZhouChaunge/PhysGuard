exp_name: "fno_cylinder"
gpu: 0
seed: 0
results_path: "./results/001-cylinder/"

# data
dataset_name: "cylinder"
dataset_root: "./dataset/"
use_hf_dataset: true
num_workers: 8
normalizer: "gaussian" # none, gaussian, range

# data parameters for training
train_data_type: "real"
mask_prob: 0.1
noise_scale: 0.0  # extra noise injected to amplify sim-to-real distribution shift (physical-forgetting experiment)

# model
model_name: "fno"
checkpoint_path: ./results/.../model_XXXX.pth  # TODO: fill in your Step-1 pretrained checkpoint path
modes1: 4
modes2: 12
modes3: 16
n_layers: 4
width: 64

# training  (same hyperparams as fno_nullspace.yaml for fair comparison)
is_use_tb:
scheduler: cosine
step_size: 1000
num_update: 4000
train_batch_size: 4
test_batch_size: 8
lr: 0.0001
clip_grad_norm: 0.

# L2 regularization (anti-forgetting baseline)
reg_type: "l2"
reg_lambda: 1.0e-4   # initial value; sweep candidates: 1e-3 / 1e-5

# evaluation
N_autoregressive: 10
N_plot: 0
probe_diagnostic: True
N_plot_probe: 12
