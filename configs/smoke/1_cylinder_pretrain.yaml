exp_name: "smoke_fno_cylinder_pretrain"
gpu: 0
seed: 0
results_path: "./results/smoke/001-cylinder/"

# data
dataset_name: "cylinder"
dataset_root: "./data/realpdebench/"
use_hf_dataset: true
num_workers: 2
normalizer: "gaussian"

# data parameters
train_data_type: "numerical"
mask_prob: 0.1
noise_scale: 0.1

# model (same arch as production config)
model_name: "fno"
modes1: 4
modes2: 12
modes3: 16
n_layers: 4
width: 64

# training (smoke: 20 steps only)
is_use_tb: false
scheduler: cosine
step_size: 1000
num_update: 20
train_batch_size: 2
test_batch_size: 4
lr: 0.0001
clip_grad_norm: 0.

# evaluation
N_autoregressive: 1
N_plot: 0
probe_diagnostic: false
