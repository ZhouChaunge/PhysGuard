exp_name: "smoke_fno_ctrl_physguard"
gpu: 0
seed: 0
results_path: "./results/smoke/002-controlled_cylinder/"

# data
dataset_name: "controlled_cylinder"
dataset_root: "./data/realpdebench/"
use_hf_dataset: true
num_workers: 2
normalizer: "gaussian"

# data parameters
train_data_type: "real"
mask_prob: 0.1
noise_scale: 0.0

# model (same arch as production config)
model_name: "fno"
checkpoint_path: ""   # filled at runtime by smoke_test.sh
modes1: 4
modes2: 12
modes3: 16
n_layers: 4
width: 64

# training (smoke: 20 steps only)
is_use_tb: false
scheduler: cosine
step_size: 1000
num_update: 20
train_batch_size: 2
test_batch_size: 4
lr: 0.0001
clip_grad_norm: 0.

# evaluation
N_autoregressive: 1
N_plot: 0
probe_diagnostic: false

# PhysGuard null-space projection (reduced scale for smoke test)
ns_n_components: 20
ns_variance_threshold: 0.9
ns_alpha: 1.0
ns_progressive: false
ns_beta_min: 0.3
ns_layer_wise: true
ns_max_samples: 20
ns_projection_path:
